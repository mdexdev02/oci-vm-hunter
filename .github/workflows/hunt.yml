name: hunt-oci-vm
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency: hunt
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPPRESS_LABEL_WARNING: 'True'
    steps:
      - name: OCI CLI 설정
        env:
          OCI_KEY: ${{ secrets.OCI_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          pip install -q oci-cli
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\ntenancy=%s\nfingerprint=%s\nregion=ap-osaka-1\nkey_file=%s/.oci/key.pem\n' \
            "$OCI_USER" "$OCI_TENANCY" "$OCI_FINGERPRINT" "$HOME" > ~/.oci/config
      - name: 이미 만들었는지 확인
        id: exists
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
        run: |
          # 인스턴스가 0개면 CLI가 빈 출력을 낸다 → 0으로 취급. 인증 오류 등은 rc로 실패 처리
          N=$(oci compute instance list -c "$OCI_TENANCY" --query 'length(data[?"lifecycle-state"!=`TERMINATED`])') || exit 1
          N=$(printf '%s' "${N:-0}" | tr -d '[:space:]')
          echo "기존 인스턴스 수: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: VM 생성 시도
        if: steps.exists.outputs.n == '0'
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_IMAGE: ${{ secrets.OCI_IMAGE }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          SSH_PUB: ${{ secrets.SSH_PUB }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          notify() { curl -s -o /dev/null -H 'Content-Type: application/json' -d "{\"content\":\"[OCI VM] $1\"}" "$DISCORD_WEBHOOK_URL"; }
          printf '%s\n' "$SSH_PUB" > key.pub
          set +e
          OUT=$(oci compute instance launch --no-retry \
            --availability-domain "lBcr:AP-OSAKA-1-AD-1" \
            --compartment-id "$OCI_TENANCY" \
            --display-name forum-vm \
            --shape VM.Standard.A1.Flex \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --image-id "$OCI_IMAGE" \
            --subnet-id "$OCI_SUBNET" \
            --assign-public-ip true \
            --boot-volume-size-in-gbs 100 \
            --ssh-authorized-keys-file key.pub 2>&1)
          RC=$?
          echo "$OUT" | tail -5
          if [ $RC -eq 0 ]; then
            echo "::error::VM 생성 성공 - OCI 콘솔 확인"
            notify "VM 생성 성공! forum-vm (A1 2코어·12GB). OCI 콘솔에서 공개 IP를 확인하세요."
            exit 1   # 실패 메일도 같이 간다
          fi
          # 정기 보고는 하루 2회(00시·12시 UTC = 09시·21시 KST)의 첫 실행에서만
          REPORT=0
          if [ "$(date -u +%H)" = "00" -o "$(date -u +%H)" = "12" ] && [ "$(date -u +%M)" -lt 15 ]; then REPORT=1; fi
          if echo "$OUT" | grep -qiE "capacity|TooManyRequests"; then
            echo "재고 없음/요청 제한 - 다음 주기에 재시도"
            [ $REPORT -eq 1 ] && notify "감시 정상 동작 중 — 아직 재고 없음 (15분마다 시도)"
            exit 0
          fi
          [ $REPORT -eq 1 ] && notify "예상 밖 오류로 VM 생성 실패 — GitHub Actions 로그를 확인하세요."
          exit 1
